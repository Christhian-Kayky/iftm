<!DOCTYPE html>
<html lang="pt=br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form>


    <label for="nome">Nome:</label><br>
    <input type="text"><br>
    <br><label>Sexo:</label><br>
        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="sexo" value="feminino">
        <label for="feminino">Feminino</label>
    <br><label for="estado_civil">Estado Civil:</label><br>
    <select>
        <option value="">Selecione</option>
        <option value="casado">Casado</option>
        <option value="solteiro">Solteiro</option>
        <option value="viuvo">Viuvo</option>
        <option value="divorciado">Divorciado</option>
        <option value="outro">Outro</option>
    </select>
    <br><br><label for="email">Email:</label><br>
    <input type="email"><br>
    <br><label for="pagina">Sua pagina web:</label><br>
    <input type="url"><br>
    <br><label for="numero">Numero Celular</label><br>
    <input type="tel"><br>
    <br><label for="endereco">Endereço:</label><br>
    <input type="text"><br>
    <br><label for="numero">Número:</label><br>
    <input type="number" min="1" max="9999"><br>
    <br><label for="dn">Data de Nascimento:</label><br>
    <input type="date">
        <br><br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
