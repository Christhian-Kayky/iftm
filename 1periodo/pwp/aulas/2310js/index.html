<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/script.js" defer type="module"></script>
    <title>Catálogo de carros</title>
</head>
<body>
    <form>
        <label for="tempo">Trocar carro a cada:</label>
        <select id="tempo">
            <option value="500" selected>0,5s</option>
            <option value="1000">1s</option>
            <option value="3000">3s</option>
        </select>
    </form>
    <div class="container">
        <div>
            <img id="imgCarro" src="" alt="">
        </div>
        <div>
            <h2>Características do carro</h2>
            <ul>
                <li>Nome: <span id="nome"></span></li>
                <li>Potência: <span id="potencia"></span></li>
            </ul>
        </div>
    </div>
</body>
</html>
